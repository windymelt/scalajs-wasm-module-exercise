# Wasm ミドルウェアの並び。要求は上から順に、応答は下から順にたどる (玉ねぎ型)。
# 途中のプラグインが応答を返すと、それより後ろは通らない。すべての応答に付けたいものは先頭に置く。
# 名前              | プラグイン                          | 許可する権限 | 設定
security-headers    | plugins/security-headers.wasm       |              |
waf                 | plugins/waf.wasm                    |              |
ratelimit           | plugins/ratelimit.wasm              | counter      | limit=5 windowMs=10000
auth                | plugins/auth.wasm                   |              | prefix=/admin token=s3cr3t-token
signature           | plugins/signature.wasm              |              |
evil                | plugins/evil.wasm                   |              |
